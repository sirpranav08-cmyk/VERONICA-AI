<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERONICA Waveform</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020408; overflow:hidden; }
#wrap {
  width:100vw; height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:20px;
}
canvas { display:block; }
#label {
  color:#00f5ff;
  font-family:monospace;
  font-size:12px;
  letter-spacing:4px;
  text-align:center;
}
#state {
  color:#00e676;
  font-family:monospace;
  font-size:10px;
  letter-spacing:3px;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="label">V.E.R.O.N.I.C.A · LIVE AUDIO</div>
  <canvas id="wv" width="800" height="200"></canvas>
  <div id="state">STANDBY</div>
</div>
<script>
const canvas = document.getElementById('wv');
const ctx = canvas.getContext('2d');
let analyser, dataArray, source;
let state = 'standby';
let phase = 0;

async function init() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    document.getElementById('state').textContent = 'LISTENING';
    state = 'listening';
  } catch(e) {
    console.log('No mic:', e);
    state = 'demo';
    document.getElementById('state').textContent = 'DEMO MODE';
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#020408';
  ctx.fillRect(0, 0, W, H);

  phase += 0.05;

  let waveData = [];

  if (analyser && dataArray) {
    analyser.getByteTimeDomainData(dataArray);
    waveData = Array.from(dataArray);
  } else {
    // Demo wave
    for (let i = 0; i < 128; i++) {
      waveData.push(128 + Math.sin(i * 0.2 + phase) * 40 +
                         Math.sin(i * 0.5 + phase * 1.3) * 20 +
                         Math.sin(i * 0.1 + phase * 0.7) * 15);
    }
  }

  // Draw multiple wave layers
  const colors = ['rgba(0,245,255,0.8)', 'rgba(0,188,212,0.4)', 'rgba(0,100,150,0.2)'];
  const offsets = [0, 3, 6];

  colors.forEach((color, ci) => {
    ctx.beginPath();
    const sliceW = W / waveData.length;

    waveData.forEach((v, i) => {
      const x = i * sliceW;
      const normalized = (v / 128.0) - 1;
      const y = H/2 + normalized * (H/2 - 10) + Math.sin(i * 0.1 + phase + ci) * offsets[ci];

      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    ctx.strokeStyle = color;
    ctx.lineWidth = ci === 0 ? 2 : 1;
    ctx.stroke();
  });

  // Center line glow
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  ctx.lineTo(W, H/2);
  ctx.strokeStyle = 'rgba(0,245,255,0.05)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Frequency bars at bottom
  if (analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    const barW = W / dataArray.length * 2;
    dataArray.forEach((v, i) => {
      const barH = (v / 255) * 40;
      const x = i * barW * 2;
      ctx.fillStyle = `rgba(0,245,255,${v/255 * 0.6})`;
      ctx.fillRect(x, H - barH, barW - 1, barH);
    });
  }

  requestAnimationFrame(draw);
}

init();
draw();
</script>
</body>
</html>
