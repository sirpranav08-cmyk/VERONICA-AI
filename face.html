<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VERONICA Face</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020408; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<script>
const canvas = document.getElementById('face');
const ctx = canvas.getContext('2d');
const S = Math.min(window.innerWidth, window.innerHeight, 400);
canvas.width = S; canvas.height = S;
const cx = S/2, cy = S/2;

// State: idle, speaking, thinking, listening
let state = 'idle';
let blinkT = 0, blinkDur = 0, nextBlink = 120;
let mouthOpen = 0, mouthTarget = 0;
let eyeGlow = 0, eyeGlowDir = 1;
let hairFlow = 0;
let breathe = 0;
let frame = 0;

// Colors
const C = {
  skin:    '#ffe0c8',
  skinD:   '#f0c4a0',
  hair:    '#1a0a2e',
  hairH:   '#4a1a8e',
  eye:     '#00f5ff',
  eyeD:    '#0088aa',
  eyeW:    '#ffffff',
  iris:    '#00d4ff',
  pupil:   '#001a22',
  lip:     '#ff6b9d',
  lipD:    '#cc4477',
  blush:   'rgba(255,150,150,0.25)',
  glow:    '#00f5ff',
  bg:      '#020408',
  cheek:   'rgba(255,180,180,0.18)',
};

function easeInOut(t){ return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

function drawFace(){
  ctx.clearRect(0,0,S,S);

  // Background glow
  const bg = ctx.createRadialGradient(cx,cy,S*0.1,cx,cy,S*0.6);
  bg.addColorStop(0,'rgba(0,245,255,0.06)');
  bg.addColorStop(1,'rgba(2,4,8,0)');
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(cx,cy,S*0.6,0,Math.PI*2); ctx.fill();

  const breatheOffset = Math.sin(breathe)*3;
  const headY = cy + breatheOffset;
  const R = S*0.28;

  // ── HAIR BACK ───────────────────────────────────────────────
  ctx.save();
  // Long hair behind
  const hairGrad = ctx.createLinearGradient(cx-R*1.2,headY-R,cx+R*1.2,headY+R*2);
  hairGrad.addColorStop(0,C.hairH);
  hairGrad.addColorStop(0.4,C.hair);
  hairGrad.addColorStop(1,'#000');
  ctx.fillStyle=hairGrad;

  // Left hair strand
  ctx.beginPath();
  ctx.moveTo(cx-R*0.8,headY-R*0.6);
  ctx.bezierCurveTo(
    cx-R*1.5+Math.sin(hairFlow)*4, headY,
    cx-R*1.4+Math.sin(hairFlow*0.7)*6, headY+R*1.5,
    cx-R*1.1, headY+R*2.2
  );
  ctx.bezierCurveTo(cx-R*0.6,headY+R*2.4,cx-R*0.3,headY+R*2,cx-R*0.2,headY+R*1.5);
  ctx.bezierCurveTo(cx-R*0.5,headY+R*0.8,cx-R*0.7,headY+R*0.2,cx-R*0.8,headY-R*0.6);
  ctx.fill();

  // Right hair strand
  ctx.beginPath();
  ctx.moveTo(cx+R*0.8,headY-R*0.6);
  ctx.bezierCurveTo(
    cx+R*1.5+Math.sin(hairFlow+1)*4, headY,
    cx+R*1.4+Math.sin(hairFlow*0.7+1)*6, headY+R*1.5,
    cx+R*1.1, headY+R*2.2
  );
  ctx.bezierCurveTo(cx+R*0.6,headY+R*2.4,cx+R*0.3,headY+R*2,cx+R*0.2,headY+R*1.5);
  ctx.bezierCurveTo(cx+R*0.5,headY+R*0.8,cx+R*0.7,headY+R*0.2,cx+R*0.8,headY-R*0.6);
  ctx.fill();
  ctx.restore();

  // ── NECK ────────────────────────────────────────────────────
  ctx.fillStyle=C.skin;
  ctx.beginPath();
  ctx.ellipse(cx,headY+R*0.85,R*0.18,R*0.22,0,0,Math.PI*2);
  ctx.fill();

  // ── HEAD ────────────────────────────────────────────────────
  const headGrad=ctx.createRadialGradient(cx-R*0.2,headY-R*0.2,R*0.1,cx,headY,R);
  headGrad.addColorStop(0,'#fff5ee');
  headGrad.addColorStop(0.6,C.skin);
  headGrad.addColorStop(1,C.skinD);
  ctx.fillStyle=headGrad;
  ctx.beginPath();
  ctx.ellipse(cx,headY,R,R*1.12,0,0,Math.PI*2);
  ctx.fill();

  // Head outline subtle
  ctx.strokeStyle='rgba(200,150,120,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(cx,headY,R,R*1.12,0,0,Math.PI*2);
  ctx.stroke();

  // ── CHEEKS ──────────────────────────────────────────────────
  ctx.fillStyle=C.cheek;
  ctx.beginPath(); ctx.ellipse(cx-R*0.52,headY+R*0.08,R*0.22,R*0.12,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+R*0.52,headY+R*0.08,R*0.22,R*0.12,0,0,Math.PI*2); ctx.fill();

  // ── EARS ────────────────────────────────────────────────────
  ctx.fillStyle=C.skin;
  ctx.beginPath(); ctx.ellipse(cx-R,headY,R*0.1,R*0.15,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+R,headY,R*0.1,R*0.15,0,0,Math.PI*2); ctx.fill();

  // ── HAIR FRONT / BANGS ──────────────────────────────────────
  ctx.fillStyle=hairGrad;

  // Main top hair
  ctx.beginPath();
  ctx.moveTo(cx-R*1.02,headY-R*0.3);
  ctx.bezierCurveTo(cx-R*0.9,headY-R*1.35,cx+R*0.9,headY-R*1.35,cx+R*1.02,headY-R*0.3);
  ctx.bezierCurveTo(cx+R*0.8,headY-R*1.5,cx-R*0.8,headY-R*1.5,cx-R*1.02,headY-R*0.3);
  ctx.fill();

  // Bangs left
  ctx.beginPath();
  ctx.moveTo(cx-R*0.9,headY-R*0.9);
  ctx.bezierCurveTo(cx-R*0.95,headY-R*0.3,cx-R*0.7,headY+R*0.05,cx-R*0.4,headY-R*0.1);
  ctx.bezierCurveTo(cx-R*0.5,headY-R*0.4,cx-R*0.6,headY-R*0.7,cx-R*0.9,headY-R*0.9);
  ctx.fill();

  // Bangs right
  ctx.beginPath();
  ctx.moveTo(cx+R*0.9,headY-R*0.9);
  ctx.bezierCurveTo(cx+R*0.95,headY-R*0.3,cx+R*0.7,headY+R*0.05,cx+R*0.4,headY-R*0.1);
  ctx.bezierCurveTo(cx+R*0.5,headY-R*0.4,cx+R*0.6,headY-R*0.7,cx+R*0.9,headY-R*0.9);
  ctx.fill();

  // Center bang
  ctx.beginPath();
  ctx.moveTo(cx-R*0.15,headY-R*1.1);
  ctx.bezierCurveTo(cx-R*0.2,headY-R*0.5,cx+R*0.2,headY-R*0.5,cx+R*0.15,headY-R*1.1);
  ctx.bezierCurveTo(cx+R*0.05,headY-R*0.3,cx-R*0.05,headY-R*0.3,cx-R*0.15,headY-R*1.1);
  ctx.fill();

  // Hair highlight
  ctx.strokeStyle='rgba(120,60,200,0.4)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.bezierCurveTo(cx-R*0.3,headY-R*1.3,cx+R*0.1,headY-R*1.4,cx+R*0.4,headY-R*1.2);
  ctx.stroke();

  // ── EYEBROWS ────────────────────────────────────────────────
  const browY = headY - R*0.32;
  ctx.strokeStyle='#2a1a4e';
  ctx.lineWidth=R*0.035;
  ctx.lineCap='round';

  // Left brow
  ctx.beginPath();
  ctx.moveTo(cx-R*0.55,browY+R*0.04);
  ctx.quadraticCurveTo(cx-R*0.38,browY-R*0.04,cx-R*0.18,browY+R*0.01);
  ctx.stroke();

  // Right brow
  ctx.beginPath();
  ctx.moveTo(cx+R*0.55,browY+R*0.04);
  ctx.quadraticCurveTo(cx+R*0.38,browY-R*0.04,cx+R*0.18,browY+R*0.01);
  ctx.stroke();

  // ── EYES ────────────────────────────────────────────────────
  const eyeY = headY - R*0.12;
  const eyeW = R*0.22, eyeH = R*0.18;
  const blinkScale = blinkT>0 ? Math.max(0.05,1-easeInOut(blinkT/blinkDur)) : 1;

  [-1,1].forEach(side=>{
    const ex = cx + side*R*0.36;

    // Eye white
    ctx.fillStyle=C.eyeW;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW,eyeH*blinkScale,0,0,Math.PI*2);
    ctx.fill();

    // Iris gradient
    const irisG=ctx.createRadialGradient(ex-eyeW*0.1,eyeY-eyeH*0.1,eyeW*0.05,ex,eyeY,eyeW*0.7);
    irisG.addColorStop(0,'#80ffff');
    irisG.addColorStop(0.3,C.iris);
    irisG.addColorStop(0.7,C.eyeD);
    irisG.addColorStop(1,'#003344');
    ctx.fillStyle=irisG;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW*0.65,eyeH*0.75*blinkScale,0,0,Math.PI*2);
    ctx.fill();

    // Pupil
    ctx.fillStyle=C.pupil;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW*0.28,eyeH*0.35*blinkScale,0,0,Math.PI*2);
    ctx.fill();

    // Eye glow
    ctx.strokeStyle=C.glow;
    ctx.lineWidth=1.5;
    ctx.globalAlpha=0.3+eyeGlow*0.4;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW*0.65,eyeH*0.75*blinkScale,0,0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;

    // Highlight
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(ex-eyeW*0.22,eyeY-eyeH*0.22,eyeW*0.12,eyeH*0.12*blinkScale,0,0,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex+eyeW*0.12,eyeY-eyeH*0.08,eyeW*0.06,eyeH*0.06*blinkScale,0,0,Math.PI*2);
    ctx.fill();

    // Upper eyelid line
    ctx.strokeStyle='#1a0a3e';
    ctx.lineWidth=R*0.025;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW,eyeH*blinkScale,0,Math.PI,Math.PI*2);
    ctx.stroke();

    // Lower lash line
    ctx.strokeStyle='rgba(30,10,60,0.5)';
    ctx.lineWidth=R*0.012;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW,eyeH*blinkScale,0,0,Math.PI);
    ctx.stroke();

    // Eye glow shadow
    ctx.shadowColor=C.glow;
    ctx.shadowBlur=R*0.15*(0.5+eyeGlow*0.5);
    ctx.strokeStyle=C.glow;
    ctx.lineWidth=0.5;
    ctx.globalAlpha=0.2;
    ctx.beginPath();
    ctx.ellipse(ex,eyeY,eyeW*0.65,eyeH*0.75*blinkScale,0,0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  });

  // ── NOSE ────────────────────────────────────────────────────
  ctx.strokeStyle='rgba(180,120,90,0.4)';
  ctx.lineWidth=R*0.018;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-R*0.06,headY+R*0.08);
  ctx.lineTo(cx,headY+R*0.18);
  ctx.lineTo(cx+R*0.06,headY+R*0.08);
  ctx.stroke();

  // ── MOUTH ───────────────────────────────────────────────────
  const mouthY = headY+R*0.38;
  const mW = R*0.28;
  const mo = mouthOpen * R*0.12;

  if(mo > 0.02){
    // Open mouth
    ctx.fillStyle='#1a0010';
    ctx.beginPath();
    ctx.ellipse(cx,mouthY+mo*0.4,mW*0.6,mo,0,0,Math.PI*2);
    ctx.fill();

    // Teeth
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.ellipse(cx,mouthY+mo*0.1,mW*0.45,mo*0.35,0,0,Math.PI);
    ctx.fill();
  }

  // Lip outline
  const lipG=ctx.createLinearGradient(cx-mW,mouthY,cx+mW,mouthY);
  lipG.addColorStop(0,C.lipD);
  lipG.addColorStop(0.5,C.lip);
  lipG.addColorStop(1,C.lipD);
  ctx.fillStyle=lipG;
  ctx.lineWidth=0;

  // Upper lip
  ctx.beginPath();
  ctx.moveTo(cx-mW,mouthY-mo*0.2);
  ctx.bezierCurveTo(cx-mW*0.5,mouthY-R*0.06-mo*0.2,cx-mW*0.1,mouthY-R*0.08-mo*0.2,cx,mouthY-R*0.04-mo*0.2);
  ctx.bezierCurveTo(cx+mW*0.1,mouthY-R*0.08-mo*0.2,cx+mW*0.5,mouthY-R*0.06-mo*0.2,cx+mW,mouthY-mo*0.2);
  ctx.lineTo(cx+mW,mouthY);
  ctx.lineTo(cx-mW,mouthY);
  ctx.closePath();
  ctx.fill();

  // Lower lip
  const lipG2=ctx.createLinearGradient(cx-mW*0.7,mouthY,cx+mW*0.7,mouthY+mo);
  lipG2.addColorStop(0,C.lipD);
  lipG2.addColorStop(0.4,'#ff88bb');
  lipG2.addColorStop(0.5,C.lip);
  lipG2.addColorStop(0.6,'#ff88bb');
  lipG2.addColorStop(1,C.lipD);
  ctx.fillStyle=lipG2;
  ctx.beginPath();
  ctx.moveTo(cx-mW,mouthY+mo*0.1);
  ctx.bezierCurveTo(cx-mW*0.5,mouthY+R*0.1+mo,cx+mW*0.5,mouthY+R*0.1+mo,cx+mW,mouthY+mo*0.1);
  ctx.closePath();
  ctx.fill();

  // Lip highlight
  ctx.fillStyle='rgba(255,220,230,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx,mouthY+mo*0.5+R*0.04,mW*0.25,R*0.025,0,0,Math.PI*2);
  ctx.fill();

  // ── CIRCUIT MARKS (AI detail) ────────────────────────────────
  ctx.strokeStyle='rgba(0,245,255,0.15)';
  ctx.lineWidth=0.8;
  // Left temple circuit
  ctx.beginPath();
  ctx.moveTo(cx-R*0.75,headY-R*0.1);
  ctx.lineTo(cx-R*0.85,headY-R*0.1);
  ctx.lineTo(cx-R*0.85,headY-R*0.2);
  ctx.lineTo(cx-R*0.95,headY-R*0.2);
  ctx.stroke();
  // Right temple circuit
  ctx.beginPath();
  ctx.moveTo(cx+R*0.75,headY-R*0.1);
  ctx.lineTo(cx+R*0.85,headY-R*0.1);
  ctx.lineTo(cx+R*0.85,headY-R*0.2);
  ctx.lineTo(cx+R*0.95,headY-R*0.2);
  ctx.stroke();

  // ── STATE INDICATOR ─────────────────────────────────────────
  const stateColors = {idle:'#00f5ff',speaking:'#ff4080',thinking:'#8866ff',listening:'#00e676'};
  const stateLabels = {idle:'STANDBY',speaking:'SPEAKING',thinking:'THINKING',listening:'LISTENING'};
  ctx.fillStyle=stateColors[state]||'#00f5ff';
  ctx.font=`bold ${R*0.12}px monospace`;
  ctx.textAlign='center';
  ctx.globalAlpha=0.7;
  ctx.fillText(stateLabels[state]||'STANDBY',cx,headY+R*1.45);
  ctx.globalAlpha=1;

  // Glow under name
  ctx.fillStyle=stateColors[state]+'22';
  ctx.beginPath();
  ctx.ellipse(cx,headY+R*1.42,R*0.5,R*0.04,0,0,Math.PI*2);
  ctx.fill();
}

function update(){
  frame++;
  breathe += 0.025;
  hairFlow += 0.02;
  eyeGlow += eyeGlowDir * 0.02;
  if(eyeGlow>=1){eyeGlowDir=-1;} if(eyeGlow<=0){eyeGlowDir=1;}

  // Blink logic
  if(blinkT>0){
    blinkT++;
    if(blinkT>blinkDur) blinkT=0;
  } else {
    nextBlink--;
    if(nextBlink<=0){
      blinkT=1; blinkDur=8;
      nextBlink=100+Math.random()*120;
    }
  }

  // Mouth animation
  if(state==='speaking'){
    mouthTarget=0.4+Math.sin(frame*0.25)*0.5;
  } else if(state==='thinking'){
    mouthTarget=0.05;
  } else {
    mouthTarget=0;
  }
  mouthOpen+=(mouthTarget-mouthOpen)*0.15;

  drawFace();
  requestAnimationFrame(update);
}

// API for external control
window.veronicaFace = {
  setState(s){ state=s; },
  speak(){ state='speaking'; setTimeout(()=>state='idle',3000); },
  think(){ state='thinking'; },
  listen(){ state='listening'; },
  idle(){ state='idle'; }
};

update();

// Demo cycle
setTimeout(()=>{ window.veronicaFace.listen(); },1000);
setTimeout(()=>{ window.veronicaFace.think(); },3000);
setTimeout(()=>{ window.veronicaFace.speak(); },5000);
setTimeout(()=>{ window.veronicaFace.idle(); },8000);
</script>
</body>
</html>
